<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200">
  <defs>
    <!-- 1. Deep Dark Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="50%" stop-color="#0B1221"/>
      <stop offset="100%" stop-color="#0A101C"/>
    </linearGradient>

    <!-- 2. The Neon Glow Effect (Mimics the monitor light in the image) -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Subtle Drop Shadow for the Text -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="860" height="200" fill="url(#bgGradient)"/>
  <!-- Glow Layer -->
  <rect width="860" height="200" fill="url(#neonGlow)"/>

  <!-- Main Name: "Solomon" (Sans-Serif, bold, white) -->
  <text x="430" y="85" font-family="'Inter', 'Montserrat', Arial, sans-serif" font-size="58" font-weight="800"
    fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">Solomon</text>

  <!-- Main Name: "Mwangi" (Script, neon cyan, slightly offset to overlap beautifully) -->
  <text x="430" y="115" font-family="'Great Vibes', 'Dancing Script', 'Brush Script MT', cursive" font-size="72"
    fill="#00E5FF" text-anchor="middle" filter="url(#glowFilter)">Mwangi</text>

  <!-- Subtitle / Role (Wide tracking, tech feel) -->
  <text x="430" y="150" font-family="'Inter', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="300"
    fill="#8892B0" text-anchor="middle" letter-spacing="4">FULL STACK ENGINEER</text>
    
  <!-- Tags / Location (Muted, smaller, monospace for tech feel) -->
  <text x="430" y="175" font-family="'Courier New', monospace" font-size="11"
    fill="#64748B" text-anchor="middle" letter-spacing="1">WEB APPLICATIONS / APIS / SAAS / CLOUD</text>

  <!-- Decorative Line (Neon accent) -->
  <line x1="360" y1="162" x2="500" y2="162" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round"/>
</svg>
