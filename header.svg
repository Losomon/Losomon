<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200">
  <defs>
    <!-- 1. Premium Background Gradient (Black to Dark Grey) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <!-- 2. Subtle Red Glow behind the name -->
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B91C1C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Richer Metallic Gold Gradient for "Solomon" -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A67C00"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F2D675"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C00"/>
    </linearGradient>

    <!-- 4. Glow filter (Reserved for accent marks only) -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 5. Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#D4AF37" opacity="0.06" />
    </pattern>

    <!-- 6. Soft Shadow for the Name -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Layers -->
  <rect width="860" height="200" fill="url(#bgGradient)"/>
  <rect width="860" height="200" fill="url(#dotGrid)"/>
  <rect width="860" height="200" fill="url(#redGlow)"/>

  <!-- Top Header: BUILD / DEPLOY / SCALE & Developer Mark -->
  <text x="40" y="35" font-family="'Inter', 'Montserrat', Arial, sans-serif" font-size="10" font-weight="600" fill="#A3A3A3" letter-spacing="2">
    BUILD <tspan fill="#D4AF37">/</tspan> DEPLOY <tspan fill="#D4AF37">/</tspan> SCALE
  </text>
  
  <text x="820" y="35" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#D4AF37" text-anchor="end" filter="url(#neonGlow)">
    &lt;/&gt;
  </text>

  <!-- Main Name: Centered, Split Color, Subtle Shadow -->
  <text x="430" y="95" font-family="'Inter', 'Montserrat', Arial, sans-serif" font-size="56" font-weight="800" font-style="normal" text-anchor="middle" letter-spacing="-1" filter="url(#textShadow)">
    <tspan fill="url(#goldText)">Solomon </tspan>
    <tspan fill="#B91C1C">Mwangi</tspan>
  </text>

  <!-- Role & Identity (Lighter Gold for Hierarchy) -->
  <text x="430" y="130" font-family="'Inter', 'Montserrat', Arial, sans-serif" font-size="14" font-weight="400" fill="#E5C45A" text-anchor="middle" letter-spacing="6">
    FULL STACK ENGINEER
  </text>

  <!-- Secondary Tags (Refined: Removed UI/UX, All Caps) -->
  <text x="430" y="155" font-family="'Courier New', monospace" font-size="11" fill="#A3A3A3" text-anchor="middle" letter-spacing="1">
    WEB APPS &nbsp;·&nbsp; APIS &nbsp;·&nbsp; SAAS &nbsp;·&nbsp; CLOUD
  </text>

  <!-- Branded Divider (Gold Lines - Red Diamond with Glow) -->
  <line x1="280" y1="175" x2="410" y2="175" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>
  <polygon points="430,168 438,175 430,182 422,175" fill="#B91C1C" filter="url(#neonGlow)"/>
  <line x1="450" y1="175" x2="580" y2="175" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Location (Moved Lower for Breathing Room) -->
  <text x="820" y="184" font-family="'Inter', 'Montserrat', Arial, sans-serif" font-size="10" font-weight="500" fill="#A3A3A3" text-anchor="end" letter-spacing="1">
    NAIROBI, KENYA 🇰🇪
  </text>
</svg>
