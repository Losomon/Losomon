[file content begin]
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200">

  <defs>

    <!-- Premium Dark Background -->
    <linearGradient id="bgGradient"
      x1="0%" y1="0%"
      x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <!-- Subtle Red Atmosphere -->
    <radialGradient id="redGlow"
      cx="50%" cy="50%"
      r="55%">
      <stop offset="0%"
        stop-color="#B91C1C"
        stop-opacity="0.10"/>
      <stop offset="100%"
        stop-color="#B91C1C"
        stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold -->
    <linearGradient id="goldText"
      x1="0%" y1="0%"
      x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A67C00"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F2D675"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C00"/>
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="dotGrid"
      width="20"
      height="20"
      patternUnits="userSpaceOnUse">
      <circle
        cx="2"
        cy="2"
        r="1"
        fill="#D4AF37"
        opacity="0.06"/>
    </pattern>

  </defs>

  <!-- ============================= -->
  <!-- BACKGROUND -->
  <!-- ============================= -->

  <rect
    width="860"
    height="200"
    fill="url(#bgGradient)"/>

  <rect
    width="860"
    height="200"
    fill="url(#dotGrid)"/>

  <rect
    width="860"
    height="200"
    fill="url(#redGlow)"/>


  <!-- ============================= -->
  <!-- SUBTLE GEOMETRY -->
  <!-- ============================= -->

  <path
    d="M0 180 L180 0"
    stroke="#D4AF37"
    stroke-width="1"
    stroke-opacity="0.04"/>

  <path
    d="M20 200 L200 20"
    stroke="#D4AF37"
    stroke-width="1"
    stroke-opacity="0.03"/>

  <path
    d="M660 200 L860 0"
    stroke="#B91C1C"
    stroke-width="1"
    stroke-opacity="0.05"/>

  <path
    d="M690 200 L860 30"
    stroke="#B91C1C"
    stroke-width="1"
    stroke-opacity="0.03"/>


  <!-- ============================= -->
  <!-- TOP LEFT BRAND LINE -->
  <!-- ============================= -->

  <text
    x="40"
    y="35"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="600"
    fill="#A3A3A3"
    letter-spacing="2">

    BUILD
    <tspan fill="#D4AF37"> / </tspan>
    DEPLOY
    <tspan fill="#D4AF37"> / </tspan>
    SCALE

  </text>


  <!-- ============================= -->
  <!-- DEVELOPER MARK -->
  <!-- ============================= -->

  <text
    x="820"
    y="35"
    font-family="Courier New, monospace"
    font-size="14"
    font-weight="700"
    fill="#D4AF37"
    text-anchor="end">

    &lt;/&gt;

  </text>


  <!-- ============================= -->
  <!-- NAME -->
  <!-- ============================= -->

  <text
    x="430"
    y="95"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56"
    font-weight="800"
    text-anchor="middle"
    letter-spacing="-1">

    <tspan fill="url(#goldText)">
      Solomon
    </tspan>

    <tspan fill="#B91C1C">
      Mwangi
    </tspan>

  </text>


  <!-- ============================= -->
  <!-- PROFESSIONAL ROLE -->
  <!-- ============================= -->

  <text
    x="430"
    y="130"
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    font-weight="600"
    fill="#E5C45A"
    text-anchor="middle"
    letter-spacing="5">

    FULL STACK ENGINEER

  </text>


  <!-- ============================= -->
  <!-- TECHNOLOGY FOCUS -->
  <!-- ============================= -->

  <text
    x="430"
    y="155"
    font-family="Courier New, monospace"
    font-size="11"
    fill="#A3A3A3"
    text-anchor="middle"
    letter-spacing="1">

    WEB APPS · APIS · SAAS · CLOUD

  </text>


  <!-- ============================= -->
  <!-- BRANDED DIVIDER -->
  <!-- ============================= -->

  <line
    x1="280"
    y1="175"
    x2="410"
    y2="175"
    stroke="#D4AF37"
    stroke-width="1"
    stroke-opacity="0.5"
    stroke-linecap="round"/>

  <!-- Red Diamond -->
  <polygon
    points="430,168 437,175 430,182 423,175"
    fill="#B91C1C"/>

  <line
    x1="450"
    y1="175"
    x2="580"
    y2="175"
    stroke="#D4AF37"
    stroke-width="1"
    stroke-opacity="0.5"
    stroke-linecap="round"/>


  <!-- ============================= -->
  <!-- LOCATION -->
  <!-- ============================= -->

  <text
    x="820"
    y="184"
    font-family="Arial, Helvetica, sans-serif"
    font-size="10"
    font-weight="500"
    fill="#A3A3A3"
    text-anchor="end"
    letter-spacing="1">

    NAIROBI, KENYA

  </text>

</svg>
[file content end]
