<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120">
  <defs>
    <!-- Background Gradient (Matches Header) -->
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#050505"/>
      <stop offset="50%"  stop-color="#111111"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <!-- Metallic Gold Gradient (For the Tagline) -->
    <linearGradient id="fgold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A67C00"/>
      <stop offset="50%"  stop-color="#F2D675"/>
      <stop offset="100%" stop-color="#A67C00"/>
    </linearGradient>

    <!-- Subtle Red Glow -->
    <radialGradient id="fredglow" cx="50%" cy="100%" r="50%">
      <stop offset="0%"   stop-color="#B91C1C" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Layers -->
  <rect width="860" height="120" fill="url(#fbg)"/>
  <rect width="860" height="120" fill="url(#fredglow)"/>

  <!-- Decorative Curved Path (Gold Tinted) -->
  <path d="M0,0 Q215,40 430,20 Q645,0 860,30 L860,0 Z" fill="#D4AF37" opacity="0.05"/>

  <!-- Top Accent Line (Matches Header Divider Style) -->
  <line x1="280" y1="30" x2="410" y2="30" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="425" y="25" width="10" height="10" fill="#B91C1C" transform="rotate(45 430 30)"/>
  <line x1="450" y1="30" x2="580" y2="30" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Tagline (Gold, Serif for Elegance) -->
  <text x="430" y="68" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="url(#fgold)" text-anchor="middle" letter-spacing="1">
    Let&#39;s Build Something Great
  </text>

  <!-- Subtext (Muted Grey with Red Accent Dot) -->
  <text x="430" y="95" font-family="Inter, Arial, sans-serif" font-size="11" fill="#A3A3A3" text-anchor="middle" letter-spacing="2">
    MADE WITH <tspan fill="#B91C1C">&#9670;</tspan> IN NAIROBI, KENYA
  </text>
</svg>
